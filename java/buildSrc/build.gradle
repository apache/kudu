// This file contains the dependencies required for the gradle build itself.

repositories {
  mavenCentral()
  maven { url = "https://plugins.gradle.org/m2/" }
}

// Manage plugin dependencies since the plugin block can't be used in included build scripts yet.
// For more details see: https://docs.gradle.org/current/userguide/plugins.html#plugins_dsl_limitations
dependencies {
  implementation "com.github.ben-manes:gradle-versions-plugin:0.51.0"
  implementation "com.gradleup.shadow:shadow-gradle-plugin:9.4.1"
  implementation "gradle.plugin.org.barfuin.gradle.jacocolog:gradle-jacoco-log:2.0.0"
  implementation "gradle.plugin.com.google.gradle:osdetector-gradle-plugin:1.7.3"
  implementation "com.google.protobuf:protobuf-gradle-plugin:0.10.0"
  implementation "com.github.spotbugs.snom:spotbugs-gradle-plugin:6.4.7"
  implementation "net.ltgt.gradle:gradle-errorprone-plugin:2.0.2"
  implementation "ru.vyarus:gradle-animalsniffer-plugin:1.7.2"
  implementation "com.google.code.gson:gson:2.11.0"
  implementation "cz.augi.gradle.scalafmt:cz.augi.gradle.scalafmt.gradle.plugin:1.21.5"
  implementation "com.google.guava:guava:33.4.0-jre"
  implementation "me.champeau.jmh:me.champeau.jmh.gradle.plugin:0.7.3"
}

// Compiler configuration
tasks.withType(GroovyCompile) {
  options.compilerArgs << '-proc:none' // Ignore leaked annotation processors on the compile classpath.
}
